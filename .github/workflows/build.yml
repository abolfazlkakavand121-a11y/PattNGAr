name: Build APK

on:
  workflow_dispatch:
    inputs:
      release_tag:
        required: false
        type: string
  push:
    branches:
      - master
      - my-releases
      - feature/serverless-method-lab-v1

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # The latest stable release, as aether's own release workflow builds with. The libaether
      # cache is keyed by the rustc it installs, so a new stable release builds the core afresh.
      RUST_TOOLCHAIN: "stable"
      # The Go line the Psiphon client's go.mod asks for, which also covers lyrebird's older one;
      # aether/psiphon-build.sh and aether/pt-build.sh pin the programs themselves. Bump it when a
      # bumped aether submodule pins a program that asks for a newer line.
      GO_VERSION: "1.26"

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        submodules: 'recursive'
        fetch-depth: '0'

    - name: Verify canonical agent guides against upstream master
      shell: bash
      run: |
        set -euo pipefail
        UPSTREAM_URL="https://github.com/2dust/v2rayNG.git"
        if git remote get-url upstream >/dev/null 2>&1; then
          test "$(git remote get-url upstream)" = "$UPSTREAM_URL"
        else
          git remote add upstream "$UPSTREAM_URL"
        fi
        git fetch upstream master
        GUIDE_PATHS=(
          ':(glob)**/AGENTS.md'
          ':(glob)**/CLAUDE.md'
          ':(glob)**/GEMINI.md'
          '.github/copilot-instructions.md'
        )
        git diff upstream/master -- "${GUIDE_PATHS[@]}"
        test -z "$(git diff --cached --name-only -- "${GUIDE_PATHS[@]}")"
        test -z "$(git diff --name-only upstream/master...HEAD -- "${GUIDE_PATHS[@]}")"

    - name: Setup Android SDK
      uses: android-actions/setup-android@v4
      with:
        log-accepted-android-sdk-licenses: false
        cmdline-tools-version: '14742923'
        packages: 'platforms;android-37.0 build-tools;37.0.0 platform-tools'

    - name: Install NDK
      run: |
        echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
          --channel=0 \
          --install "ndk;30.0.16248370"
        echo "NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> $GITHUB_ENV
        sed -i '10i\
        \
            ndkVersion = "30.0.16248370"' ${{ github.workspace }}/V2rayNG/app/build.gradle.kts

    - name: Restore cached libhevtun
      id: cache-libhevtun-restore
      uses: actions/cache/restore@v6
      with:
        path: ${{ github.workspace }}/libs
        key: libhevtun-${{ runner.os }}-${{ env.NDK_HOME }}-${{ hashFiles('.git/modules/hev-socks5-tunnel/HEAD') }}-${{ hashFiles('compile-hevtun.sh') }}

    - name: Build libhevtun
      if: steps.cache-libhevtun-restore.outputs.cache-hit != 'true'
      run: |
        bash compile-hevtun.sh
    
    - name: Save libhevtun
      if: steps.cache-libhevtun-restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ${{ github.workspace }}/libs
        key: libhevtun-${{ runner.os }}-${{ env.NDK_HOME }}-${{ hashFiles('.git/modules/hev-socks5-tunnel/HEAD') }}-${{ hashFiles('compile-hevtun.sh') }}

    - name: Install Rust
      id: rust-toolchain
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ env.RUST_TOOLCHAIN }}
        targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

    - name: Restore cached libaether
      id: cache-libaether-restore
      uses: actions/cache/restore@v6
      with:
        path: ${{ github.workspace }}/libs-aether
        key: libaether-${{ runner.os }}-${{ env.NDK_HOME }}-${{ steps.rust-toolchain.outputs.cachekey }}-${{ hashFiles('.git/modules/aether/HEAD') }}-${{ hashFiles('compile-aether.sh') }}

    - name: Build libaether
      if: steps.cache-libaether-restore.outputs.cache-hit != 'true'
      run: |
        bash compile-aether.sh

    - name: Save libaether
      if: steps.cache-libaether-restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ${{ github.workspace }}/libs-aether
        key: libaether-${{ runner.os }}-${{ env.NDK_HOME }}-${{ steps.rust-toolchain.outputs.cachekey }}-${{ hashFiles('.git/modules/aether/HEAD') }}-${{ hashFiles('compile-aether.sh') }}

    - name: Install Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}
        # The client is built from a checkout of its own; there is no go.sum here to cache by.
        cache: false

    # The Aether core runs Psiphon as a program of its own, the psiphon-tunnel-core console client,
    # which the app ships beside the core as libpsiphon-tunnel-core.so; see compile-psiphon.sh.
    - name: Restore cached Psiphon client
      id: cache-psiphon-restore
      uses: actions/cache/restore@v6
      with:
        path: ${{ github.workspace }}/libs-psiphon
        key: psiphon-${{ runner.os }}-${{ env.GO_VERSION }}-${{ hashFiles('aether/psiphon-build.sh') }}-${{ hashFiles('compile-psiphon.sh') }}

    - name: Build the Psiphon client
      if: steps.cache-psiphon-restore.outputs.cache-hit != 'true'
      run: |
        bash compile-psiphon.sh

    - name: Save the Psiphon client
      if: steps.cache-psiphon-restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ${{ github.workspace }}/libs-psiphon
        key: psiphon-${{ runner.os }}-${{ env.GO_VERSION }}-${{ hashFiles('aether/psiphon-build.sh') }}-${{ hashFiles('compile-psiphon.sh') }}

    # Tor's bridges run through a pluggable transport, a program of its own: lyrebird, which aether
    # builds and the app ships beside the core as liblyrebird.so; see compile-pt.sh.
    - name: Restore cached pluggable transport
      id: cache-pt-restore
      uses: actions/cache/restore@v6
      with:
        path: ${{ github.workspace }}/libs-pt
        key: pt-${{ runner.os }}-${{ env.GO_VERSION }}-${{ hashFiles('aether/pt-build.sh') }}-${{ hashFiles('compile-pt.sh') }}

    - name: Build the pluggable transport
      if: steps.cache-pt-restore.outputs.cache-hit != 'true'
      run: |
        bash compile-pt.sh

    - name: Save the pluggable transport
      if: steps.cache-pt-restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ${{ github.workspace }}/libs-pt
        key: pt-${{ runner.os }}-${{ env.GO_VERSION }}-${{ hashFiles('aether/pt-build.sh') }}-${{ hashFiles('compile-pt.sh') }}

    - name: Stage the native libraries
      run: |
        cp -r ${{ github.workspace }}/libs ${{ github.workspace }}/V2rayNG/app
        cp -r ${{ github.workspace }}/libs-aether/. ${{ github.workspace }}/V2rayNG/app/libs/
        cp -r ${{ github.workspace }}/libs-psiphon/. ${{ github.workspace }}/V2rayNG/app/libs/
        cp -r ${{ github.workspace }}/libs-pt/. ${{ github.workspace }}/V2rayNG/app/libs/

    # Psiphon's client starts with the newest server list the build could fetch, so a fresh install has
    # servers before it can reach the list on its own; see fetch-psiphon-servers.sh.
    - name: Fetch the Psiphon server list
      run: |
        bash fetch-psiphon-servers.sh

    - name: Checkout custom AndroidLibXrayLite
      uses: actions/checkout@v7
      with:
        repository: abolfazlkakavand121-a11y/AndroidLibXrayLite
        ref: 5e7a13c2720566bb9d987b89cadf9572524e622f
        path: AndroidLibXrayLite-custom
        persist-credentials: false

    - name: Install AndroidLib Go toolchain
      uses: actions/setup-go@v6
      with:
        go-version-file: AndroidLibXrayLite-custom/go.mod
        cache-dependency-path: AndroidLibXrayLite-custom/go.sum

    - name: Install gomobile and AndroidLib NDK
      working-directory: AndroidLibXrayLite-custom
      run: |
        go install golang.org/x/mobile/cmd/gomobile@latest
        echo "$HOME/go/bin" >> $GITHUB_PATH
        echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --channel=0 --install "ndk;29.0.14206865"
        echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> $GITHUB_ENV

    - name: Build custom libv2ray AAR
      working-directory: AndroidLibXrayLite-custom
      run: |
        mkdir -p assets data
        bash gen_assets.sh download
        cp -v data/*.dat assets/
        gomobile init
        go mod tidy
        gomobile bind -v -androidapi 29 -trimpath -ldflags='-s -w -buildid= -checklinkname=0' ./
        test -s libv2ray.aar
        cp -v libv2ray.aar ../V2rayNG/app/libs/libv2ray.aar

    - name: Restore PattNG NDK
      run: |
        echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> $GITHUB_ENV

    - name: Setup Java
      uses: actions/setup-java@v6.2.0
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Build APK (debug-signed validation build)
      run: |
        cd ${{ github.workspace }}/V2rayNG
        echo "sdk.dir=${ANDROID_HOME}" > local.properties
        chmod 755 gradlew
        # Run unit tests, then produce an installable debug-signed APK for validation.
        # Permanent release signing is intentionally disabled until a private keystore is configured.
        ./gradlew :app:testPlaystoreDebugUnitTest
        ./gradlew :app:assemblePlaystoreDebug -PABI_FILTERS=arm64-v8a

    - name: Check the native libraries in the APKs
      run: |
        # Validate the arm64 APK contains the expected native libraries before uploading it.
        shopt -s nullglob
        apks=(${{ github.workspace }}/V2rayNG/app/build/outputs/apk/playstore/debug/*arm64-v8a*.apk)
        if [ "${#apks[@]}" -ne 1 ]; then
          echo "::error::Expected exactly one Play Store arm64-v8a debug APK, found ${#apks[@]}"
          exit 1
        fi
        apk="${apks[0]}"
        entries=$(unzip -Z1 "$apk" | grep '^lib/' || true)
        echo "$(basename "$apk"):"
        echo "$entries" | sed 's/^/  /'
        for lib in libaether.so libpsiphon-tunnel-core.so liblyrebird.so; do
          if ! echo "$entries" | grep -qx "lib/arm64-v8a/$lib"; then
            echo "::error::$(basename "$apk") lacks lib/arm64-v8a/$lib"
            exit 1
          fi
        done

    - name: Upload arm64-v8a validation APK
      uses: actions/upload-artifact@v7
      if: ${{ success() }}
      with:
        name: arm64-v8a-debug-validation
        path: ${{ github.workspace }}/V2rayNG/app/build/outputs/apk/playstore/debug/*arm64-v8a*.apk

    - name: Upload native libraries for signed release
      uses: actions/upload-artifact@v7
      if: ${{ success() }}
      with:
        name: pattng-native-libraries
        path: ${{ github.workspace }}/V2rayNG/app/libs/
        if-no-files-found: error
        retention-days: 1

  sign-and-release:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
    runs-on: ubuntu-26.04
    permissions:
      contents: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          submodules: 'false'

      - name: Download native libraries built and tested by the validation job
        uses: actions/download-artifact@v8
        with:
          name: pattng-native-libraries
          path: ${{ github.workspace }}/V2rayNG/app/libs/

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          log-accepted-android-sdk-licenses: false
          cmdline-tools-version: '14742923'
          packages: 'platforms;android-37.0 build-tools;37.0.0 platform-tools'

      - name: Install NDK
        shell: bash
        run: |
          set -euo pipefail
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --channel=0 --install "ndk;30.0.16248370"
          python3 - <<'PY'
          from pathlib import Path
          path = Path("V2rayNG/app/build.gradle.kts")
          content = path.read_text()
          marker = '    ndkVersion = "30.0.16248370"'
          if marker not in content:
              needle = "android {\n"
              if content.count(needle) != 1:
                  raise SystemExit("Could not locate the Android Gradle block exactly once")
              content = content.replace(needle, needle + marker + "\n", 1)
              path.write_text(content)
          PY

      - name: Setup Java
        uses: actions/setup-java@v6.2.0
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Prepare Android release keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing required GitHub Actions secret: $name"
              exit 1
            fi
          done
          KEYSTORE_DIR="$RUNNER_TEMP/pattng-signing"
          mkdir -p "$KEYSTORE_DIR"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_DIR/release.jks"
          test -s "$KEYSTORE_DIR/release.jks"
          chmod 600 "$KEYSTORE_DIR/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_DIR/release.jks" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Build signed Play Store release APKs
        shell: bash
        env:
          PATTNG_VERSION: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          cd ${{ github.workspace }}/V2rayNG
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
          chmod 755 gradlew
          if [[ ! "$PATTNG_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::release_tag must use semantic version format, for example 2.4.2"
            exit 1
          fi
          ./gradlew :app:assemblePlaystoreRelease -PpattngVersion="$PATTNG_VERSION"

      - name: Verify APK signatures and prepare checksums
        shell: bash
        run: |
          set -euo pipefail
          APK_DIR="${{ github.workspace }}/V2rayNG/app/build/outputs/apk/playstore/release"
          APK_SIGNER="$ANDROID_HOME/build-tools/37.0.0/apksigner"
          test -x "$APK_SIGNER"
          shopt -s nullglob
          apks=("$APK_DIR"/*.apk)
          if [[ "${#apks[@]}" -lt 1 ]]; then
            echo "::error::No signed release APKs were produced"
            exit 1
          fi
          mkdir -p release-files
          reference_cert=""
          for apk in "${apks[@]}"; do
            "$APK_SIGNER" verify --verbose "$apk"
            cert="$("$APK_SIGNER" verify --print-certs "$apk" | awk -F': ' '/Signer #1 certificate SHA-256 digest/ {print $2; exit}')"
            if [[ -z "$cert" ]]; then
              echo "::error::Could not read signing certificate for $(basename "$apk")"
              exit 1
            fi
            if [[ -z "$reference_cert" ]]; then
              reference_cert="$cert"
            elif [[ "$cert" != "$reference_cert" ]]; then
              echo "::error::Release APKs were signed with different certificates"
              exit 1
            fi
            cp "$apk" release-files/
          done
          (cd release-files && sha256sum *.apk > SHA256SUMS)
          echo "Verified ${#apks[@]} signed APK(s) with certificate SHA-256 $reference_cert"

      - name: Publish signed GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          name: PattNG v${{ inputs.release_tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          prerelease: false
          files: release-files/*
